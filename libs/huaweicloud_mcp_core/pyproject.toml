[project]
name = "huaweicloud-mcp-core"
version = "1.2.0"
description = "Shared core library for Huawei Cloud MCP servers (config, credentials, guardrails, output)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=2.0",
    "huaweicloudsdkcore>=3.1",
    "huaweicloudsdkiam>=3.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Force pyasn1 >= 0.6.4 to fix 3 DoS CVEs (CVE-2026-59884/59885/59886).
# huaweicloudsdkcore<=3.1.218 pins pyasn1<=0.6.3 in its own requires_dist, so we
# must override that upper bound here until the SDK ships a relaxed constraint.
[tool.uv]
override-dependencies = ["pyasn1>=0.6.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/huaweicloud_mcp_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/huaweicloud_mcp_core/py.typed" = "huaweicloud_mcp_core/py.typed"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["huaweicloudsdkcore.*", "huaweicloudsdkiam.*"]
ignore_missing_imports = true
